items:
  - source: github
    repo: "yetone/magpie"
    eyebrow: "yetone /"
    title: "magpie"
    description: "Atur semua model AI untuk coding agent di satu tempat. Jalankan Codex pakai DeepSeek atau Claude pakai Kimi."
    screenshot_path: "/tmp/tcd_part2_picks/img_0da371085bce013f.png"
    url: "https://github.com/yetone/magpie"
    badges:
      - { text: "★ 41,435", style: "glass" }
      - { text: "+20,773 bulan ini", style: "accent" }
      - { text: "MIT", style: "glass" }
    command_or_url: "$ curl -fsSL https://usemagpie.ai/install.sh | sh"
    footnote: "SATU GATEWAY · CLAUDE CODE · CODEX · GEMINI CLI"
    footnote_accent: true
    image_fit: "cover"
    ambient_tint: "rgba(10, 14, 26, 0.82)"

