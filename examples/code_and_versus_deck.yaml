  preset: midnight-emerald
  watermark: "@yourhandle"
  watermark_position: bottom-right

cover:
  mode: gradient
  badge_icon: sparkles
  badge_text: "DEV TIPS · PART 1"
  title_lines:
    - "Clean Code"
    - "*& Modern Tools*"
    - "worth switching to."
  subtitle: "Practical **Python refactors** and side-by-side **tooling upgrades**."
  cta_text: "Swipe to see them →"

outro:
  enabled: true
  badge_text: "DONE · WANT PART 2?"
  title_lines:
    - "Save this post"
    - "*& follow*"
    - "for more dev tips."
  subtitle: "Weekly **code audits, open-source tools & comparisons**."
