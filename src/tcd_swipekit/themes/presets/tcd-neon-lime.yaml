# Official Try Catch Dev (TCD) Brand Theme
# Palette: Neon Lime (#D4F93A), Deep Obsidian (#080B10), Card Dark (#0D121F),
#          Panel Border (#161F30), Pure White (#FFFFFF), Muted Slate (#94A3B8)

preset: tcd-neon-lime
is_light: false
bg_color: "#080B10"
cover_bg_color: "#080B10"
text_color: "#FFFFFF"
muted_color: "#94A3B8"
subtle_color: "#94A3B8"
divider_color: "#161F30"
accent_color: "#D4F93A"
accent_text_color: "#080B10"
pill_accent_bg: "#D4F93A"
pill_accent_text: "#080B10"
pill_glass_bg: "#0D121F"
pill_glass_border: "#161F30"
cli_bg: "#0D121F"
cli_border: "#161F30"
cli_text: "#FFFFFF"
font_heading: "Inter"
font_body: "Inter"
font_mono: "JetBrains Mono"
ambient_blur: true
ambient_brightness: 0.24
ambient_saturation: 1.35
card_radius: 24
watermark: "@trycatchdev"
watermark_position: bottom-right
